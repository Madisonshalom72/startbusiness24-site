    <path d="M420 110 h210 l84 84 v150 a16 16 0 0 1 -16 16 h-278 a16 16 0 0 1 -16 -16 v-218 a16 16 0 0 1 16 -16 z" fill="#2a1c10" stroke="#ff5a1f" stroke-width="4"/>
    <circle cx="462" cy="152" r="15" fill="none" stroke="#e3bd85" stroke-width="4"/>
    <text x="452" y="238" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#f4ecdc">THE WHOLE</text>
    <text x="452" y="272" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#f4ecdc">PACKAGE</text>
    <text x="452" y="338" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ff5a1f">$50</text>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#9a8b74">Plain prices — reviewed before anything is charged</text>
  <text x="400" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff5a1f">PRICING</text>
